name = "membersite-leosiqra"
main = "cloudflare/src/index.ts"
compatibility_date = "2026-04-22"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "membersite_leosiqra_db"
database_id = "a04174cd-6f44-4403-bec1-6ca3dddb1a9c"
migrations_dir = "cloudflare/migrations"

[[r2_buckets]]
binding = "FILES_BUCKET"
bucket_name = "leosiqra-assets"

[[ratelimits]]
name = "LOGIN_RATE_LIMITER"
namespace_id = "1001"
[ratelimits.simple]
limit = 5
period = 60

[[ratelimits]]
name = "AI_PARSE_RATE_LIMITER"
namespace_id = "1002"
[ratelimits.simple]
limit = 12
period = 60

[assets]
directory = "./out"
binding = "ASSETS"
# Tanpa ini, request ke "/" persis (root) di-serve langsung dari index.html
# oleh layer static assets Cloudflare SEBELUM sempat masuk ke fetch handler
# Worker — jadi redirect apex->www / http->https di index.ts tidak pernah
# kepanggil khusus untuk "/". Path lain (mis. "/privacy.html") tetap lewat
# Worker seperti biasa karena bukan clean-URL match otomatis, jadi cukup
# paksa "/" saja lewat Worker dulu, bukan semua asset (biar tidak nambah
# latency ke tiap request gambar/font/JS).
run_worker_first = ["/"]

[durable_objects]
bindings = [
  { name = "REALTIME_ROOM", class_name = "RealtimeRoom" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RealtimeRoom"]

[triggers]
# 03:00 UTC = 10:00 WIB — deposito jatuh tempo + pengingat recurring hari ini.
# 17:01 UTC = 00:01 WIB (hari berikutnya) — ringkasan pengeluaran/pemasukan kemarin.
crons = ["0 3 * * *", "1 17 * * *"]

[vars]
APP_NAME = "Leosiqra"
APP_ENV = "development"
APP_URL = "http://127.0.0.1:8787"
SESSION_COOKIE_NAME = "leosiqra_session"
MAINTENANCE_BYPASS_ADMIN = "true"
NEXT_PUBLIC_USE_CLOUDFLARE_AUTH = "true"
# Plugin web search OpenRouter untuk AI Leosiqra — dikenakan biaya tambahan
# per request (di luar token biasa, lihat OpenRouter pricing). Set "false"
# kapan saja buat matikan tanpa perlu ubah kode.
OPENROUTER_WEB_SEARCH = "true"
