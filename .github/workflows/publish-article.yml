# Menerbitkan artikel draf CEO setelah Bos menekan ✅ Terbitkan di Telegram.
# Dipicu Worker (workflow_dispatch). Berlapis pengaman:
#   1. slug harus huruf-kecil-dan-strip; branch HARUS claude/artikel-<slug>
#   2. diff vs main HANYA boleh menyentuh src/app/panduan/<slug>/ dan src/app/sitemap.ts
#   3. kode berbahaya (script, dangerouslySetInnerHTML, eval, fetch, process.env, import/require dinamis) ditolak
#      tanpa peduli huruf besar/kecil, dan import hanya boleh dari allowlist (next, next/link, lucide-react, GuideLayout)
#   (checkout tanpa kredensial tersimpan: build tidak bisa memakai token; token hanya dipakai di langkah merge)
#   4. tsc + build harus lulus
# Baru setelah itu: deploy → merge ke main → kabar ke Telegram (sukses ATAU gagal).
#
# Secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID — deploy Worker (izin: Workers Scripts:Edit)
#   PROMO_SECRET                                — lapor ke Telegram lewat Worker
name: Terbitkan artikel

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "slug artikel (branch claude/artikel-<slug>)"
        required: true

permissions:
  contents: write

concurrency:
  group: publish-article
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SLUG: ${{ inputs.slug }}
      API: https://membersite-leosiqra.leowendry.workers.dev
    steps:
      - name: Validasi slug
        run: |
          [[ "$SLUG" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ && ${#SLUG} -ge 3 && ${#SLUG} -le 50 ]] || { echo "slug tidak valid"; exit 1; }

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Periksa isi branch
        run: |
          git config user.name "leosiqra-bot"
          git config user.email "leosiqra-bot@users.noreply.github.com"
          BR="origin/claude/artikel-$SLUG"
          git rev-parse --verify "$BR" >/dev/null || { echo "branch $BR tidak ada"; exit 1; }
          FILES=$(git diff --name-only "origin/main...$BR")
          echo "$FILES"
          [ -n "$FILES" ] || { echo "tidak ada perubahan"; exit 1; }
          echo "$FILES" | grep -qx "src/app/panduan/$SLUG/page.tsx" || { echo "page.tsx artikel tidak ada"; exit 1; }
          BAD=$(echo "$FILES" | grep -vE "^(src/app/panduan/$SLUG/|src/app/sitemap\.ts$)" || true)
          [ -z "$BAD" ] || { echo "file di luar izin:"; echo "$BAD"; exit 1; }
          ADDED=$(git diff "origin/main...$BR" | grep -E '^\+' | grep -vE '^\+\+\+ ' || true)
          if echo "$ADDED" | grep -iE 'dangerouslySetInnerHTML|<script|next/script|eval\(|new Function|fetch\(|XMLHttpRequest|process\.env|document\.cookie|localStorage|child_process|require\(|import\(|import\.meta'; then
            echo "kode terlarang ditemukan"; exit 1
          fi
          BADIMP=$(echo "$ADDED" | grep -E '^\+\s*(import|export .* from)' | grep -vE "from ['\"](next|next/link|lucide-react|@/components/guide/GuideLayout)['\"];?\s*$" || true)
          [ -z "$BADIMP" ] || { echo "import di luar allowlist:"; echo "$BADIMP"; exit 1; }

      - name: Gabungkan ke salinan main (belum di-push)
        run: |
          git merge --no-ff -m "Artikel $SLUG (disetujui Bos lewat Telegram)" "origin/claude/artikel-$SLUG"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy cloudflare/src/index.ts

      - name: Merge ke main
        env:
          GH_TOKEN: ${{ github.token }}
        run: git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main

      - name: Kabari Telegram (sukses)
        if: success()
        env:
          PROMO_SECRET: ${{ secrets.PROMO_SECRET }}
        run: |
          curl -s -H "x-promo-secret: $PROMO_SECRET" -F "text=✅ Artikel LIVE: https://www.leosiqra.com/panduan/$SLUG
          Sudah masuk sitemap. Biar Google lebih cepat, buka Search Console → Inspeksi URL → Minta pengindeksan." "$API/api/promo/telegram"

      - name: Kabari Telegram (gagal)
        if: failure()
        env:
          PROMO_SECRET: ${{ secrets.PROMO_SECRET }}
        run: |
          curl -s -H "x-promo-secret: $PROMO_SECRET" -F "text=❌ Penerbitan artikel $SLUG GAGAL (belum ada yang berubah di situs). Lihat log: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "$API/api/promo/telegram"
