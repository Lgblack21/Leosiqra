# Deploy main ke produksi TANPA laptop: dipicu manual oleh Bos dari GitHub
# (Actions → Deploy main → Run workflow, bisa dari aplikasi GitHub di HP).
# Urutan: validasi konfirmasi → tsc + build → migrasi D1 yang dipilih → deploy → kabar Telegram.
# Kalau build/migrasi gagal, deploy TIDAK dijalankan (situs tetap versi lama).
#
# Migrasi hanya dari daftar di bawah (ALLOWED) dan semuanya additive + IF NOT EXISTS,
# jadi aman kalau terjalankan ulang. Tambah nama file ke ALLOWED hanya untuk migrasi
# yang sudah di-review & memang additive.
#
# Catatan: input kosong di workflow_dispatch diganti nilai default oleh GitHub,
# jadi default migrasi HARUS kosong (run #1 2026-10-26 gagal karena ini).
#
# Secrets (sama dengan publish-article.yml):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID — deploy Worker; migrasi butuh izin tambahan D1:Edit
#   PROMO_SECRET                                — lapor ke Telegram lewat Worker
name: Deploy main

on:
  workflow_dispatch:
    inputs:
      konfirmasi:
        description: 'Ketik "gas" untuk deploy main ke produksi'
        required: true
      migrasi:
        description: "Migrasi D1 sebelum deploy, mis. 0010_mcp.sql (pisahkan spasi; kosong = tanpa migrasi). Token GitHub saat ini belum punya izin D1 — jalankan migrasi lewat Console D1 di dashboard."
        required: false
        default: ""

permissions:
  contents: write # hanya untuk tag & GitHub Release vX.Y.Z setelah deploy sukses

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KONFIRMASI: ${{ inputs.konfirmasi }}
      MIGRASI: ${{ inputs.migrasi }}
      API: https://membersite-leosiqra.leowendry.workers.dev
      ALLOWED: "0010_mcp.sql 0011_mcp_oauth.sql"
    steps:
      - name: Validasi input
        run: |
          [ "$KONFIRMASI" = "gas" ] || { echo 'konfirmasi harus "gas"'; exit 1; }
          for m in $MIGRASI; do
            [[ " $ALLOWED " == *" $m "* ]] || { echo "migrasi $m tidak ada di daftar ALLOWED"; exit 1; }
          done

      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx tsc --noEmit
      # Ikon aplikasi bank/e-wallet HD → public/logos (lihat skripnya). Gagal tidak menghentikan deploy.
      - name: Logo bank (HD)
        continue-on-error: true
        run: node scripts/fetch-logos.mjs
      - name: Build
        env:
          LEOSIQRA_BUILD: ${{ github.run_number }} # tampil di app sebagai "· build N"
        run: npm run build

      - name: Migrasi D1
        if: inputs.migrasi != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for m in $MIGRASI; do
            echo "== $m"
            npx wrangler d1 execute membersite_leosiqra_db --remote --yes --file "cloudflare/migrations/$m"
          done

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy cloudflare/src/index.ts

      # Versi dari package.json (lihat CHANGELOG.md). Rilis dibuat sekali per versi;
      # deploy ulang versi yang sama hanya menaikkan nomor build.
      - name: Tag & Release versi
        id: rilis
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSI=$(node -p "require('./package.json').version")
          echo "versi=$VERSI" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSI" >/dev/null 2>&1; then
            echo "status=sudah ada (versi belum dinaikkan)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          awk -v v="$VERSI" '$0 ~ "^## " v " " {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Catatan rilis belum ditulis di CHANGELOG.md." > notes.md
          gh release create "v$VERSI" --target "$GITHUB_SHA" --title "Leosiqra $VERSI" --notes-file notes.md
          echo "status=rilis baru" >> "$GITHUB_OUTPUT"

      - name: Kabari Telegram (sukses)
        if: success()
        env:
          PROMO_SECRET: ${{ secrets.PROMO_SECRET }}
          VERSI: ${{ steps.rilis.outputs.versi }}
          STATUS_RILIS: ${{ steps.rilis.outputs.status }}
        run: |
          curl -sS --fail-with-body -H "x-promo-secret: $PROMO_SECRET" --form-string "text=✅ Deploy main LIVE: v${VERSI:-?} · build $GITHUB_RUN_NUMBER ($(git rev-parse --short HEAD)) — ${STATUS_RILIS:-tag gagal dibuat, cek log}. Migrasi: ${MIGRASI:-tidak ada}." "$API/api/promo/telegram"

      - name: Kabari Telegram (gagal)
        if: failure()
        env:
          PROMO_SECRET: ${{ secrets.PROMO_SECRET }}
        run: |
          curl -sS --fail-with-body -H "x-promo-secret: $PROMO_SECRET" -F "text=❌ Deploy main GAGAL. Lihat log: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "$API/api/promo/telegram"
